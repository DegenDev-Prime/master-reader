name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships an Android SDK, but not necessarily the exact
      # platform, build-tools, NDK and CMake this build needs. `setup-android`
      # is not used because its licence step blocks on an interactive prompt.
      - name: Set up the Android SDK
        run: |
          sdkmanager="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Set Android version code
        run: |
          node -e "const fs=require('fs');const c=require('./app.json');c.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER||1);fs.writeFileSync('app.json',JSON.stringify(c,null,2)+'\n');"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
          echo "KEYSTORE=$RUNNER_TEMP/keystore.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      # A build that only compiled some of the ABIs installs fine and crashes
      # on launch, so the APKs are rejected here rather than after release.
      - name: Verify native libraries
        run: |
          scripts/android/verify-apk.sh \
            android/app/build/outputs/apk/release/app-universal-release.apk \
            arm64-v8a armeabi-v7a x86 x86_64
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            scripts/android/verify-apk.sh \
              "android/app/build/outputs/apk/release/app-${abi}-release.apk" \
              "$abi"
          done

      - name: Align and sign APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev"
          fi
          mkdir -p build/release
          src="android/app/build/outputs/apk/release"

          # The universal APK works on every device, so it gets the plain name.
          scripts/android/sign-apk.sh \
            "$src/app-universal-release.apk" \
            "build/release/master-reader-${version}.apk"

          # The per-ABI APKs are about a third of the size.
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            scripts/android/sign-apk.sh \
              "$src/app-${abi}-release.apk" \
              "build/release/master-reader-${version}-${abi}.apk"
          done

          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.apk
          generate_release_notes: true
          body: |
            ## Downloads

            | File | Size | Use it when |
            | ---- | ---- | ----------- |
            | `master-reader-${{ env.VERSION }}.apk` | universal, all ABIs | You are not sure which device you have |
            | `master-reader-${{ env.VERSION }}-arm64-v8a.apk` | ~74 MB | Almost every phone from the last decade |
            | `master-reader-${{ env.VERSION }}-armeabi-v7a.apk` | ~57 MB | Older 32-bit devices |
            | `master-reader-${{ env.VERSION }}-x86_64.apk` | ~80 MB | Android emulators |
            | `master-reader-${{ env.VERSION }}-x86.apk` | ~81 MB | Older emulators |

            Every APK is signed with the same release key, so you can install one
            now and upgrade in place later.

            ## Verify a download

            ```bash
            unzip -Z1 master-reader-${{ env.VERSION }}.apk | grep '\.so$' | head
            ```

            ## Note

            Master Reader is unofficial and not affiliated with any content
            provider. It is intended for adults (18+). You are responsible for
            complying with the terms of service of any source you use.

      - name: Build self-hosted F-Droid repository
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
          FDROID_REPO_URL: ${{ vars.FDROID_REPO_URL }}
        run: |
          if [ -z "$FDROID_REPO_KEYSTORE_BASE64" ] || [ -z "$FDROID_REPO_URL" ]; then
            echo "F-Droid repository is not configured; skipping."
            exit 0
          fi
          python3 -m pip install --user fdroidserver
          echo "$FDROID_REPO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fdroid-repo.jks"
          export FDROID_REPO_KEYSTORE="$RUNNER_TEMP/fdroid-repo.jks"
          export PATH="$HOME/.local/bin:$PATH"
          scripts/fdroid/build-repo.sh build/fdroid build/release/*.apk
          tar -czf "master-reader-fdroid-repo-${VERSION}.tar.gz" -C build/fdroid/repo .
          gh release upload "$GITHUB_REF_NAME" "master-reader-fdroid-repo-${VERSION}.tar.gz" --clobber
