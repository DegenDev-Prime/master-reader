name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships an Android SDK, but not necessarily the exact
      # platform, build-tools, NDK and CMake this build needs. `setup-android`
      # is not used because its licence step blocks on an interactive prompt.
      - name: Set up the Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      # A partial ABI build installs but crashes on launch. The APK is
      # rejected here instead of shipping a broken download.
      - name: Verify native libraries
        run: |
          scripts/android/verify-apk.sh \
            android/app/build/outputs/apk/release/app-universal-release.apk \
            arm64-v8a armeabi-v7a x86 x86_64
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            scripts/android/verify-apk.sh \
              "android/app/build/outputs/apk/release/app-${abi}-release.apk" \
              "$abi"
          done
